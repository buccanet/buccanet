# Publishes server.json to the official MCP Registry (https://registry.modelcontextprotocol.io) as
# io.github.buccanet/buccanet. The registry accepts an organization namespace only from a credential that proves
# the organization: this job's GitHub OIDC token does, with no stored secret. Run it after each npm release whose
# version server.json names, by hand or by pushing the matching v* tag.
name: MCP registry

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install mcp-publisher 1.8.16
        run: |
          curl -sSfL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/mcp-publisher_linux_amd64.tar.gz \
            | tar xz mcp-publisher
      - name: Log in with the job's OIDC token
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
