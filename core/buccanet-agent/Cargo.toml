[package]
name = "buccanet-agent"
description = "Buccanet agent rules without IO: which messages wake an agent, the prompt it reads, and the secret check on what it sends."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
buccanet-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
# The fence markers are matched in ASCII mode, so no Unicode table of regex enters the WebAssembly build.
regex = { version = "1", default-features = false, features = ["std"] }
